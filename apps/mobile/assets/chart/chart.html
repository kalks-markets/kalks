<!doctype html>
<!--
  Kalks Trader chart page for the app's WebView (Android). The same engine as the web terminal: TradingView
  Lightweight Charts 5.2.1, bundled OFFLINE next to this file (lightweight-charts.standalone.production.js, Apache 2.0,
  LICENSE-lightweight-charts.txt), and the web terminal's own indicators (indicators.bundle.js, generated from
  apps/terminal by tool/build_chart_indicators.mjs: the same maths, overlays, sub-windows and levels as the web).
  The app owns the data and sends it as JSON to window.K.recv(msg) or, coalesced, window.K.batch("[msg, …]"); this page
  draws it and posts gestures back on the `KalksChart` channel (lib/features/terminal/chart/chart_bridge.dart):
    in:  init {digits, intraday, palette, symbol, tf, step, chartType, indicators, texts} · bars {bars}
         · older {bars, exhausted} · bar {bar} · quote {bid, ask} · lines {lines: [{id, kind, price, label, side, drag,
         note, tone, close, handles?, pip?, gap?}]} · palette {palette} · indicators {indicators} · chartType {chartType}
    out: ready · dragstart {id} · drag {id, price} · tap {id} · close {id} · older {before} · long {price} · ind {uid}
  A position line with `handles` ("st" / "s" / "t": no stop loss / no take profit yet) shows small S (red outline) and
  T (blue outline) squares after its P&L, like the web (components/chart/trade-handles.ts): pulling one out makes a
  temporary `sl:TICKET` / `tp:TICKET` line that follows the finger, held on the side of the price the trade server
  accepts (`gap` = the stops level in price units), and posts drag {id: "sl:TICKET", price} when the finger lifts; a
  tap posts it at the order tickets' starting distance (max(10 pips, 2 x spread), twice that for TP; `pip` = pip size).
  Bars are [time (server-time seconds), open, high, low, close, volume]. Like the web chart (components/chart/
  engine.ts + chart-view.tsx): candles / bars / line / area, the OHLC legend with one row per indicator (tap: show /
  hide, settings, remove), oscillators in their own sub-windows, the account's bid / ask lines, trade-line chips at the
  price scale (drag to move, × to close / remove, the P&L on them), and the small Kalks K in the plot's corner.
  A dragged chip follows the finger at frame rate: moves are applied once per animation frame, and trade-line updates
  from the app wait until the finger lifts.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <style>
      @font-face {
        font-family: "GeistMono";
        src: url("../fonts/GeistMono-Medium.ttf") format("truetype");
        font-weight: 500;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg, #0a0a0d);
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      #c {
        position: absolute;
        inset: 0;
      }
      #chips {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 4;
      }
      .legend {
        position: absolute;
        left: 8px;
        z-index: 5;
        pointer-events: none;
        font: 500 11px "GeistMono", ui-monospace, monospace;
        line-height: 16px;
        color: var(--fg3, #8b8b96);
        max-width: calc(100% - 84px);
      }
      #legend {
        top: 6px;
      }
      .legend b {
        font-weight: 600;
        color: var(--fg, #f5f5f7);
        margin-right: 6px;
      }
      .legend .v {
        margin-right: 6px;
      }
      .lr {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 18px;
        white-space: nowrap;
        overflow: hidden;
        pointer-events: auto;
        font-size: 10.5px;
      }
      .lr .ll {
        color: var(--fg2, #a1a1aa);
      }
      .lr.off .ll {
        color: var(--fg3, #8b8b96);
        text-decoration: line-through;
      }
      .lmore {
        pointer-events: auto;
        font-size: 10.5px;
        height: 18px;
        display: inline-flex;
        align-items: center;
        color: var(--fg3, #8b8b96);
      }
      .chip {
        position: absolute;
        left: 0;
        top: 0;
        height: 20px;
        display: flex;
        align-items: center;
        border-radius: 5px;
        border: 1px solid transparent;
        font: 500 10.5px "GeistMono", ui-monospace, monospace;
        line-height: 1;
        white-space: nowrap;
        pointer-events: auto;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        overflow: hidden;
        will-change: transform;
      }
      .chip > span {
        padding: 0 5px;
        height: 100%;
        display: flex;
        align-items: center;
      }
      .chip .grip {
        opacity: 0.7;
        font-size: 9px;
        letter-spacing: -1px;
        padding: 0 1px 0 4px;
      }
      .chip .note {
        border-left: 1px solid rgba(127, 127, 127, 0.35);
      }
      .chip .x {
        border-left: 1px solid rgba(127, 127, 127, 0.35);
        padding: 0 6px;
        font-size: 12px;
      }
      /* a position's S / T handles: small outlined squares, each in a finger-sized hit area */
      .chip .hs {
        border-left: 1px solid rgba(127, 127, 127, 0.35);
        padding: 0 2px;
      }
      .chip .hb {
        height: 100%;
        display: flex;
        align-items: center;
        padding: 0 3px;
        touch-action: none;
      }
      .chip .hb.on {
        opacity: 0.35;
      }
      .chip .h {
        width: 14px;
        height: 14px;
        box-sizing: border-box;
        border: 1px solid;
        border-radius: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 700 9px system-ui, -apple-system, Roboto, sans-serif;
        line-height: 1;
        letter-spacing: 0;
      }
      .chip.dragging {
        z-index: 2;
        box-shadow: 0 0 0 2px rgba(255, 90, 31, 0.45), 0 4px 14px rgba(0, 0, 0, 0.4);
      }
      #ghost {
        position: absolute;
        left: 0;
        top: 0;
        border-top: 1px dashed rgba(160, 160, 170, 0.7);
        pointer-events: none;
        z-index: 3;
        display: none;
        will-change: transform;
      }
    </style>
    <script src="lightweight-charts.standalone.production.js"></script>
    <script src="indicators.bundle.js"></script>
  </head>
  <body>
    <div id="c"></div>
    <div id="legend" class="legend"><div id="ohlc"></div><div id="lrows"></div></div>
    <div id="plegs"></div>
    <div id="ghost"></div>
    <div id="chips"></div>
    <script>
      (function () {
        "use strict";
        const LC = window.LightweightCharts;
        const KI = window.KalksInd;
        const host = document.getElementById("c");
        const chipsEl = document.getElementById("chips");
        const ghost = document.getElementById("ghost");
        const ohlcEl = document.getElementById("ohlc");
        const rowsEl = document.getElementById("lrows");
        const plegsEl = document.getElementById("plegs");
        const post = (m) => {
          try {
            window.KalksChart.postMessage(JSON.stringify(m));
          } catch (e) {
            /* no channel (opened in a browser) */
          }
        };

        // Kalks mark (assets/brand/kalks-mark.svg), viewBox 653 x 541
        const MARK_D =
          "M 403.113 2.545 C 382.191 7.084, 370.755 13.650, 346.500 35.052 C 338.250 42.332, 320.925 57.415, 308 68.571 C 295.075 79.727, 271.225 100.410, 255 114.535 C 238.775 128.659, 217.888 146.794, 208.584 154.835 C 184.119 175.980, 178.518 183.282, 173.512 200.554 L 171 209.224 171 273.457 C 171 343.176, 170.712 339.361, 176.125 341.269 C 179.126 342.326, 187.413 337.402, 223.546 313.086 C 299.928 261.683, 352.834 224.527, 423.005 173 C 436.861 162.825, 455.241 149.385, 463.849 143.133 C 472.457 136.882, 484.450 128.070, 490.500 123.551 C 496.550 119.032, 506.225 111.857, 512 107.606 C 525.694 97.526, 590.533 48.622, 602.811 39.112 C 608.057 35.049, 617.783 27.637, 624.425 22.642 C 631.066 17.647, 640.031 10.734, 644.346 7.280 L 652.192 1 530.846 1.079 C 431.400 1.145, 408.347 1.409, 403.113 2.545 M 135.134 63.542 C 106.181 79.766, 63.818 105.655, 49.568 115.834 C 39.269 123.191, 23.932 137.825, 18.510 145.470 C 12.674 153.699, 7.552 164.207, 4.257 174.712 L 1.500 183.500 1.232 338.325 L 0.963 493.151 5.232 490.175 C 7.579 488.539, 21.875 478.983, 37 468.941 C 102.832 425.232, 131.171 400.632, 140.735 378.892 C 146.852 364.986, 146.500 375.277, 146.500 210.500 L 146.500 60.500 144 60.238 C 142.583 60.089, 138.744 61.520, 135.134 63.542 M 320 284.624 C 300.125 288.511, 288.493 295.042, 231.500 334.316 C 199.923 356.077, 192.902 361.250, 193.199 362.540 C 193.731 364.854, 322.089 498.457, 338.940 514.237 C 351.464 525.965, 366.500 534.233, 382.107 537.974 C 390.252 539.927, 393.740 539.986, 500.250 539.993 C 560.612 539.997, 610 539.747, 610 539.437 C 610 538.507, 567.999 494.055, 509.045 432.590 C 478.495 400.739, 447.695 368.564, 440.599 361.090 C 415.222 334.357, 386.390 305.726, 380 300.913 C 366.069 290.420, 351.004 285.163, 333 284.514 C 327.225 284.306, 321.375 284.355, 320 284.624";
        let markPath = null;
        class Watermark {
          constructor() {
            this.dark = true;
            this.request = null;
            const self = this;
            this.views = [
              {
                zOrder: () => "bottom",
                renderer: () => ({
                  draw() {},
                  drawBackground(target) {
                    target.useMediaCoordinateSpace(({ context: ctx, mediaSize }) => {
                      const w = mediaSize.width,
                        h = mediaSize.height;
                      if (w < 120 || h < 80) return;
                      const mh = h < 220 ? 14 : 18,
                        mw = (mh * 653) / 541,
                        pad = 10;
                      markPath = markPath || new Path2D(MARK_D);
                      ctx.save();
                      ctx.translate(pad, h - pad - mh);
                      ctx.scale(mw / 653, mh / 541);
                      ctx.fillStyle = self.dark ? "rgba(255,255,255,0.28)" : "rgba(15,15,20,0.26)";
                      ctx.fill(markPath, "evenodd");
                      ctx.restore();
                    });
                  },
                }),
              },
            ];
          }
          attached(p) {
            this.request = p.requestUpdate;
          }
          detached() {
            this.request = null;
          }
          paneViews() {
            return this.views;
          }
          setDark(d) {
            this.dark = d;
            if (this.request) this.request();
          }
        }

        let chart = null,
          main = null,
          vol = null,
          bidLine = null,
          askLine = null,
          wm = null,
          layer = null;
        let initMsg = null,
          pal = null,
          digits = 2,
          symbol = "",
          tf = "",
          step = 60,
          ctype = "candles",
          texts = {},
          data = [],
          loadingOlder = false,
          exhausted = false,
          hover = -1,
          bid = 0,
          ask = 0,
          alive = { v: true };
        let lines = [];
        let pendingLines = null;
        let inds = [];
        let legendOpen = false;
        const priceLines = new Map();
        const chips = new Map();
        let drag = null;
        // a stop just made from an S / T handle: kept on the chart until the app's lines carry it (or briefly, if the
        // app's next lines were already on their way)
        let sticky = null;

        const fmt = (p) => Number(p).toFixed(digits);
        const pow = () => Math.pow(10, digits);
        const toBar = (b) => ({ time: b[0], open: b[1], high: b[2], low: b[3], close: b[4], volume: b[5] || 0 });
        const volColor = (d) => (d.close >= d.open ? pal.up + "38" : pal.down + "38");
        const volPoint = (d) => ({ time: d.time, value: d.volume, color: volColor(d) });
        const mainPoint = (d) => (ctype === "line" || ctype === "area" ? { time: d.time, value: d.close } : { time: d.time, open: d.open, high: d.high, low: d.low, close: d.close });
        const onWarm = () => (pal.dark ? "#1a1204" : "#ffffff");
        const sepColor = () => (pal.dark ? "rgba(255,255,255,0.07)" : "rgba(15,15,20,0.1)");
        const pane0H = () => {
          try {
            return chart.panes()[0].getHeight();
          } catch (e) {
            return host.clientHeight - 30;
          }
        };

        /* ---------------- frame scheduling ---------------- */

        let rafId = 0,
          wantPlace = false,
          wantLegend = false;
        function frame() {
          rafId = 0;
          if (wantPlace) {
            wantPlace = false;
            placeChips();
          }
          if (wantLegend) {
            wantLegend = false;
            legend();
          }
        }
        const schedule = () => {
          if (!rafId) rafId = requestAnimationFrame(frame);
        };
        const schedulePlace = () => {
          wantPlace = true;
          schedule();
        };
        const scheduleLegend = () => {
          wantLegend = true;
          schedule();
        };

        /* ---------------- legend ---------------- */

        let legendSig = "";
        let rowEls = new Map();
        function legend() {
          if (!chart || !data.length) {
            ohlcEl.innerHTML = "";
            rowsEl.innerHTML = "";
            plegsEl.innerHTML = "";
            legendSig = "";
            return;
          }
          const i = hover >= 0 && hover < data.length ? hover : data.length - 1;
          const b = data[i];
          const col = b.close >= b.open ? pal.up : pal.down;
          const v = (k, x) => `<span class="v">${k} <span style="color:${col}">${fmt(x)}</span></span>`;
          ohlcEl.innerHTML = `<b>${symbol}, ${tf}</b>${v("O", b.open)}${v("H", b.high)}${v("L", b.low)}${v("C", b.close)}`;
          const rows = layer ? layer.legend(i) : [];
          // main-pane rows (overlays and hidden instances) fold into "+N more" when they would cover the pane
          const mainRows = rows.filter((r) => r.pane <= 0);
          const subRows = rows.filter((r) => r.pane > 0);
          const maxRows = Math.max(1, Math.floor((pane0H() - 70) / 18));
          const folded = !legendOpen && mainRows.length > maxRows;
          const shownMain = folded ? mainRows.slice(0, maxRows - 1) : mainRows;
          let tops = [0];
          if (subRows.length) {
            const top0 = host.getBoundingClientRect().top;
            tops = chart.panes().map((p) => {
              const el = p.getHTMLElement && p.getHTMLElement();
              return el ? Math.round(el.getBoundingClientRect().top - top0) : 0;
            });
          }
          const sig = JSON.stringify([shownMain.map((r) => [r.uid, r.label, r.visible]), subRows.map((r) => [r.uid, r.label, r.pane, tops[r.pane]]), folded, legendOpen, mainRows.length]);
          if (sig !== legendSig) {
            legendSig = sig;
            rowEls = new Map();
            rowsEl.innerHTML = "";
            plegsEl.innerHTML = "";
            const make = (r) => {
              const el = document.createElement("div");
              el.className = "lr" + (r.visible ? "" : " off");
              el.dataset.uid = r.uid;
              const l = document.createElement("span");
              l.className = "ll";
              l.textContent = r.label;
              const vals = document.createElement("span");
              vals.className = "lvs";
              el.append(l, vals);
              el.addEventListener("pointerdown", (e) => e.stopPropagation());
              el.addEventListener("click", (e) => {
                e.stopPropagation();
                post({ type: "ind", uid: r.uid });
              });
              rowEls.set(r.uid, vals);
              return el;
            };
            for (const r of shownMain) rowsEl.appendChild(make(r));
            if (mainRows.length > maxRows || legendOpen) {
              if (mainRows.length > maxRows) {
                const m = document.createElement("div");
                m.className = "lmore";
                m.textContent = legendOpen ? texts.less || "Show less" : (texts.more || "+{count} more").replace("{count}", String(mainRows.length - shownMain.length));
                m.addEventListener("pointerdown", (e) => e.stopPropagation());
                m.addEventListener("click", (e) => {
                  e.stopPropagation();
                  legendOpen = !legendOpen;
                  legend();
                });
                rowsEl.appendChild(m);
              }
            }
            for (const r of subRows) {
              if (tops[r.pane] === undefined) continue;
              const box = document.createElement("div");
              box.className = "legend";
              box.style.top = tops[r.pane] + 3 + "px";
              box.appendChild(make(r));
              plegsEl.appendChild(box);
            }
          }
          for (const r of rows) {
            const el = rowEls.get(r.uid);
            if (!el) continue;
            let html = "";
            for (const x of r.values) html += `<span style="color:${x.color}">${x.text}</span> `;
            if (el._h !== html) {
              el._h = html;
              el.innerHTML = html;
            }
          }
        }

        /* ---------------- chart ---------------- */

        function addMain() {
          const pf = { type: "price", precision: digits, minMove: 1 / pow() };
          if (ctype === "bars") main = chart.addSeries(LC.BarSeries, { upColor: pal.up, downColor: pal.down, thinBars: false, priceFormat: pf });
          else if (ctype === "line") main = chart.addSeries(LC.LineSeries, { color: pal.gold, lineWidth: 2, priceFormat: pf, crosshairMarkerVisible: false });
          else if (ctype === "area") main = chart.addSeries(LC.AreaSeries, { lineColor: pal.gold, topColor: "rgba(233,185,73,0.28)", bottomColor: "rgba(233,185,73,0.0)", lineWidth: 2, priceFormat: pf, crosshairMarkerVisible: false });
          else main = chart.addSeries(LC.CandlestickSeries, { upColor: pal.up, downColor: pal.down, borderVisible: false, wickUpColor: pal.up, wickDownColor: pal.down, priceFormat: pf });
          main.applyOptions({ priceLineVisible: false, lastValueVisible: false, title: "" });
        }

        function setVars() {
          const s = document.documentElement.style;
          s.setProperty("--bg", pal.bg);
          s.setProperty("--fg", pal.fg);
          s.setProperty("--fg2", pal.fg2);
          s.setProperty("--fg3", pal.fg3);
          // the indicator layer reads the "info" colour token from this variable (layer.ts tokenMap)
          if (pal.info) s.setProperty("--k-info", pal.info);
        }

        function build(msg) {
          if (chart) {
            alive.v = false;
            chart.remove();
          }
          alive = { v: true };
          const a = alive;
          initMsg = msg;
          priceLines.clear();
          chips.clear();
          chipsEl.innerHTML = "";
          drag = null;
          sticky = null;
          pendingLines = null;
          legendSig = "";
          digits = msg.digits;
          pal = msg.palette;
          symbol = msg.symbol || "";
          tf = msg.tf || "";
          step = msg.step || 60;
          ctype = msg.chartType || "candles";
          texts = msg.texts || {};
          hover = -1;
          setVars();
          chart = LC.createChart(host, {
            autoSize: true,
            layout: {
              background: { type: "solid", color: pal.bg },
              textColor: pal.fg3,
              fontFamily: "GeistMono, ui-monospace, monospace",
              fontSize: 10.5,
              attributionLogo: false,
              panes: { separatorColor: sepColor(), separatorHoverColor: "rgba(255,90,31,0.35)", enableResize: true },
            },
            grid: { vertLines: { color: pal.grid }, horzLines: { color: pal.grid } },
            rightPriceScale: { borderVisible: true, borderColor: pal.line, scaleMargins: { top: 0.12, bottom: 0.14 }, minimumWidth: 60 },
            timeScale: { borderVisible: true, borderColor: pal.line, timeVisible: msg.intraday, secondsVisible: false, rightOffset: 8, barSpacing: 7, minBarSpacing: 1.5 },
            crosshair: {
              mode: 0,
              vertLine: { color: pal.fg3, width: 1, style: 2, labelBackgroundColor: pal.label },
              horzLine: { color: pal.fg3, width: 1, style: 2, labelBackgroundColor: pal.label },
            },
            localization: { priceFormatter: fmt },
            handleScale: { axisPressedMouseMove: true, pinch: true, mouseWheel: true },
            handleScroll: { horzTouchDrag: true, vertTouchDrag: false, pressedMouseMove: true },
            kineticScroll: { touch: true },
          });
          addMain();
          vol = chart.addSeries(LC.HistogramSeries, { priceScaleId: "vol", priceLineVisible: false, lastValueVisible: false, priceFormat: { type: "volume" } });
          chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.86, bottom: 0 } });
          // Squeeze / spread the prices by dragging the price axis with a finger (MT5): lightweight-charts only scales
          // the axis on a vertical touch drag while handleScroll.vertTouchDrag is on (its PriceAxisWidget treats the
          // drag as page scroll otherwise), and that option would also let a vertical drag on the plot pan the prices.
          // So it is on only from a touch that starts on an axis until the finger lifts. A double tap resets the scale.
          if (!host.dataset.axisTouch) {
            host.dataset.axisTouch = "1";
            host.addEventListener(
              "touchstart",
              (e) => {
                const t = e.touches[0];
                if (!t || !chart || e.touches.length !== 1) return;
                if (t.clientX - host.getBoundingClientRect().left >= chart.timeScale().width()) {
                  chart.applyOptions({ handleScroll: { vertTouchDrag: true } });
                }
              },
              { capture: true, passive: true },
            );
            const axisTouchEnd = () => {
              if (chart && !drag) chart.applyOptions({ handleScroll: { vertTouchDrag: false } });
            };
            window.addEventListener("touchend", axisTouchEnd, { capture: true, passive: true });
            window.addEventListener("touchcancel", axisTouchEnd, { capture: true, passive: true });
          }
          wm = new Watermark();
          wm.setDark(pal.dark);
          chart.panes()[0].attachPrimitive(wm);
          bidLine = main.createPriceLine({ price: 0, color: pal.fg2, lineWidth: 1, lineStyle: 1, axisLabelVisible: true, title: "", axisLabelColor: pal.fg2, axisLabelTextColor: pal.dark ? "#0a0a0d" : "#fff" });
          // the ask is the buy price: the buy colour (Kalks Trader: blue = up / buy / profit / TP)
          askLine = main.createPriceLine({ price: 0, color: pal.up, lineWidth: 1, lineStyle: 1, axisLabelVisible: true, title: "", axisLabelColor: pal.up, axisLabelTextColor: "#fff" });
          bid = 0;
          ask = 0;
          data = [];
          layer = KI
            ? KI.createIndicatorLayer({ chart, bars: () => data, step, digits, palette: pal, alive: () => a.v, onChange: scheduleLegend })
            : null;
          // validated against the registry like the web workspace (unknown types dropped, params repaired)
          inds = KI ? KI.migrateIndicators(msg.indicators || []) : [];
          if (layer) layer.sync(inds);
          chart.timeScale().subscribeVisibleLogicalRangeChange((r) => {
            schedulePlace();
            if (!r || exhausted || loadingOlder || !data.length || r.from > 30) return;
            loadingOlder = true;
            post({ type: "older", before: data[0].time });
          });
          chart.subscribeCrosshairMove((p) => {
            hover = !p || p.logical === undefined || p.logical === null || !p.time ? -1 : Math.max(0, Math.min(data.length - 1, Math.round(p.logical)));
            scheduleLegend();
          });
          lines = [];
          renderLines();
          legend();
        }

        function drawAll() {
          main.setData(data.map(mainPoint));
          vol.setData(data.map(volPoint));
          if (layer) layer.reset();
        }

        function setBars(bars) {
          data = bars.map(toBar);
          exhausted = false;
          loadingOlder = false;
          drawAll();
          scheduleLegend();
          chart.timeScale().scrollToRealTime();
          requestAnimationFrame(() => {
            if (!chart) return;
            chart.timeScale().applyOptions({ barSpacing: 7, rightOffset: 8 });
            chart.timeScale().scrollToRealTime();
            schedulePlace();
          });
        }

        function prepend(bars, done) {
          loadingOlder = false;
          exhausted = !!done;
          if (!bars.length || !data.length) return;
          const first = data[0].time;
          const add = bars.filter((b) => b[0] < first).map(toBar);
          if (!add.length) {
            exhausted = true;
            return;
          }
          data = add.concat(data);
          drawAll();
          schedulePlace();
          scheduleLegend();
        }

        function upsertBar(raw) {
          if (!data.length) return;
          const b = toBar(raw);
          const last = data[data.length - 1];
          if (b.time < last.time) return;
          if (b.time > last.time) data.push(b);
          else data[data.length - 1] = b;
          main.update(mainPoint(b));
          vol.update(volPoint(b));
          if (layer) layer.update();
          if (hover < 0) scheduleLegend();
          schedulePlace();
        }

        function setQuote(b, a) {
          if (!bidLine) return;
          if (b !== bid) bidLine.applyOptions({ price: b });
          if (a !== ask) askLine.applyOptions({ price: a });
          bid = b;
          ask = a;
        }

        function setIndicators(list) {
          inds = KI ? KI.migrateIndicators(list || []) : [];
          legendSig = "";
          if (layer) layer.sync(inds);
          scheduleLegend();
        }

        /** Chart type: a fresh chart (like the web), keeping the data, the lines and the view. */
        function setChartType(t) {
          if (!initMsg || t === ctype) return;
          const saved = data,
            savedLines = lines,
            b = bid,
            a = ask,
            range = chart.timeScale().getVisibleLogicalRange(),
            ex = exhausted;
          build(Object.assign({}, initMsg, { chartType: t, indicators: inds, palette: pal }));
          data = saved;
          exhausted = ex;
          drawAll();
          if (range) chart.timeScale().setVisibleLogicalRange(range);
          setQuote(b, a);
          lines = savedLines;
          renderLines();
          legend();
        }

        /* ---------------- trade lines ---------------- */

        const colorOf = (l) =>
          l.kind === "sl" ? pal.down : l.kind === "tp" ? pal.up : l.kind === "pending" ? pal.gold : l.kind === "alert" || l.kind === "barrier" ? pal.warn : l.kind === "strike" ? pal.ember : l.kind === "breakeven" ? pal.fg2 : l.side === "buy" ? pal.up : pal.down;
        // 0 solid · 1 dotted · 2 dashed · 4 sparse dotted (lightweight-charts LineStyle)
        const styleOf = (l) => (l.kind === "pos" ? 0 : l.kind === "alert" ? 4 : l.kind === "breakeven" ? 1 : 2);

        function chipColors(l) {
          if (l.kind === "sl") return [pal.down, "#fff", pal.down];
          if (l.kind === "tp") return [pal.up, "#fff", pal.up];
          if (l.kind === "pending") return [pal.gold, onWarm(), pal.gold];
          if (l.kind === "alert" || l.kind === "barrier") return [pal.warn, onWarm(), pal.warn];
          if (l.kind === "strike") return [pal.ember, "#fff", pal.ember];
          if (l.kind === "breakeven") return [pal.panel, pal.fg2, pal.fg3];
          const c = l.side === "buy" ? pal.up : pal.down;
          return [pal.panel, c, c];
        }

        const setText = (el, s) => {
          if (el.textContent !== s) el.textContent = s;
        };

        /* ---------------- S / T handles ---------------- */

        const refOf = (id) => id.slice(id.indexOf(":") + 1);
        const pulled = (k, ref) => !!drag && drag.id === k + ":" + ref;
        /** The handles a position chip shows now: "sl" / "tp" while the position has no such stop (a stop being made
         *  counts; the handle under the finger stays, dimmed, until it lifts). */
        function handlesOf(l) {
          if (l.kind !== "pos" || !l.handles) return [];
          const ref = refOf(l.id);
          const out = [];
          for (const k of ["sl", "tp"]) {
            if (l.handles.indexOf(k[0]) < 0) continue;
            if (!pulled(k, ref) && lines.some((x) => x.id === k + ":" + ref)) continue;
            out.push(k);
          }
          return out;
        }
        /** Holds a stop on the side of the close price the trade server accepts (services/trading check_sltp): a buy
         *  closes at the bid, so its SL stays the stops level (at least one point) below it and its TP as far above;
         *  a sell closes at the ask, mirrored. */
        function clampStop(kind, side, price, gap) {
          const lim = Math.max(gap || 0, 1 / pow());
          const buy = side === "buy";
          const ref = buy ? bid : ask;
          const p = buy === (kind === "sl") ? Math.min(price, ref - lim) : Math.max(price, ref + lim);
          return Math.round(p * pow()) / pow();
        }
        /** A tapped handle: the order tickets' starting distance, max(10 pips, 2 x spread) for SL and twice that for
         *  TP, from the price the position closes at now. */
        function defaultStop(kind, side, pip, gap) {
          if (!(bid > 0 && ask > 0 && pip > 0)) return null;
          const base = Math.max(10, Math.round(Math.max(1, (ask - bid) / pip) * 2));
          const dist = (kind === "sl" ? base : base * 2) * pip;
          const buy = side === "buy";
          return clampStop(kind, side, (buy ? bid : ask) + (buy === (kind === "tp") ? dist : -dist), gap);
        }
        const stopLine = (pos, kind, price) => ({ id: kind + ":" + refOf(pos.id), kind, price, label: kind.toUpperCase(), side: pos.side, drag: false, close: false });
        /** The app's lines, with a just-made stop kept until they carry it. */
        function withSticky(list) {
          if (!sticky) return list;
          if (list.some((x) => x.id === sticky.line.id) || Date.now() > sticky.until) {
            sticky = null;
            return list;
          }
          return list.concat([sticky.line]);
        }

        function fillChip(c, l) {
          const [bg, fg, border] = chipColors(l);
          const filled = l.kind !== "pos" && l.kind !== "breakeven";
          const noteColor = filled ? fg : l.tone === "up" ? pal.up : l.tone === "down" ? pal.down : pal.fg2;
          const hs = handlesOf(l);
          const ref = l.kind === "pos" ? refOf(l.id) : "";
          const hsig = hs.map((k) => k + (pulled(k, ref) ? "*" : "")).join(",");
          const sig = [bg, fg, border, l.drag, l.note || "", noteColor, l.close, hsig].join("|");
          if (c.sig !== sig) {
            c.sig = sig;
            const el = c.el;
            el.style.background = bg;
            el.style.color = fg;
            el.style.borderColor = border;
            c.grip.style.display = l.drag ? "flex" : "none";
            c.note.style.display = l.note ? "flex" : "none";
            c.note.textContent = l.note || "";
            c.note.style.color = noteColor;
            c.hs.style.display = hs.length ? "flex" : "none";
            for (const k of ["sl", "tp"]) {
              const b = c.h[k];
              const col = k === "sl" ? pal.down : pal.up;
              b.style.display = hs.indexOf(k) >= 0 ? "flex" : "none";
              b.classList.toggle("on", pulled(k, ref));
              b.firstChild.style.color = col;
              b.firstChild.style.borderColor = col;
              b.firstChild.textContent = texts[k] || k[0].toUpperCase();
              b.title = texts[k + "Title"] || "";
              b.setAttribute("aria-label", b.title || k.toUpperCase());
            }
            c.x.style.display = l.close ? "flex" : "none";
            c.w = -1;
          }
          const dragging = drag && drag.id === l.id && drag.moved;
          setLabel(c, dragging && l.kind !== "pos" ? l.label + " " + fmt(drag.price) : l.label);
        }

        /** The chip font is monospaced: the width changes only with the text length. */
        function setLabel(c, s) {
          if (c.lbl.textContent === s) return;
          if (c.lbl.textContent.length !== s.length) c.w = -1;
          c.lbl.textContent = s;
        }

        function lineOpts(l, price) {
          const col = colorOf(l);
          return { price, color: col, lineWidth: 1, lineStyle: styleOf(l), axisLabelVisible: true, title: "", axisLabelColor: col, axisLabelTextColor: l.kind === "pending" || l.kind === "alert" || l.kind === "barrier" ? onWarm() : "#fff" };
        }

        function renderLines() {
          if (!main) return;
          const want = new Set(lines.map((l) => l.id));
          for (const [id, pl] of priceLines) {
            if (!want.has(id)) {
              main.removePriceLine(pl.line);
              priceLines.delete(id);
            }
          }
          for (const [id, c] of chips) {
            if (!want.has(id) && !(drag && drag.id === id)) {
              c.el.remove();
              chips.delete(id);
            }
          }
          for (const l of lines) {
            const price = drag && drag.id === l.id && drag.moved ? drag.price : l.price;
            const opts = lineOpts(l, price);
            const key = JSON.stringify(opts);
            const pl = priceLines.get(l.id);
            if (!pl) priceLines.set(l.id, { line: main.createPriceLine(opts), key });
            else if (pl.key !== key) {
              pl.line.applyOptions(opts);
              pl.key = key;
            }
            let c = chips.get(l.id);
            if (!c) {
              const el = document.createElement("div");
              el.className = "chip";
              el.dataset.id = l.id;
              const grip = document.createElement("span");
              grip.className = "grip";
              grip.textContent = "⋮⋮";
              const lbl = document.createElement("span");
              lbl.className = "lbl";
              const note = document.createElement("span");
              note.className = "note";
              const hs = document.createElement("span");
              hs.className = "hs";
              hs.style.display = "none";
              const h = {};
              for (const k of ["sl", "tp"]) {
                const b = document.createElement("span");
                b.className = "hb";
                b.dataset.handle = k;
                b.setAttribute("role", "button");
                const sq = document.createElement("span");
                sq.className = "h";
                b.appendChild(sq);
                hs.appendChild(b);
                h[k] = b;
              }
              const x = document.createElement("span");
              x.className = "x";
              x.textContent = "×";
              el.append(grip, lbl, note, hs, x);
              c = { el, grip, lbl, note, hs, h, x, l, sig: "", w: -1, tx: NaN, ty: NaN, shown: true };
              chips.set(l.id, c);
              const cc = c;
              for (const k of ["sl", "tp"]) h[k].addEventListener("pointerdown", (e) => startDrag(e, cc, k));
              x.addEventListener("pointerdown", (e) => {
                e.preventDefault();
                e.stopPropagation();
              });
              x.addEventListener("click", (e) => {
                e.stopPropagation();
                post({ type: "close", id: cc.l.id });
              });
              el.addEventListener("pointerdown", (e) => startDrag(e, cc));
              chipsEl.appendChild(el);
            }
            c.l = l;
            fillChip(c, l);
          }
          placeChips();
        }

        const show = (c, on) => {
          if (c.shown === on) return;
          c.shown = on;
          c.el.style.display = on ? "flex" : "none";
        };
        const moveTo = (c, x, y) => {
          if (c.tx === x && c.ty === y) return;
          c.tx = x;
          c.ty = y;
          c.el.style.transform = `translate(${x}px, ${y - 11}px)`; // 22 px tall with its border: centred on the line
        };

        /** Chips sit at the price scale like the web's; chips of nearby prices line up side by side to the left. The
         *  dragged chip follows the finger on its own. Widths are measured once per text length (no layout per frame). */
        function placeChips() {
          if (!main || !chart) return;
          const plotW = chart.timeScale().width();
          // chips stay in the main window (a line at its very bottom keeps its chip); a chip is 22 px tall and
          // centred on its line, so the ones near the pane's bottom edge are held above the next window
          const maxY = pane0H() + 1;
          const clampY = (y) => Math.min(y, pane0H() - 11);
          const shown = [];
          let dragged = null;
          for (const c of chips.values()) {
            const l = c.l;
            const isDrag = drag && drag.id === l.id && drag.moved;
            const y = main.priceToCoordinate(isDrag ? drag.price : l.price);
            if (y === null || y < 8 || y > maxY) {
              if (!isDrag) {
                show(c, false);
                continue;
              }
            }
            show(c, true);
            if (isDrag) dragged = { c, y: y === null ? drag.y : y };
            else shown.push({ c, y });
          }
          // reads first (widths of chips whose text changed), then writes
          for (const s of shown) if (s.c.w < 0) s.c.w = s.c.el.offsetWidth;
          if (dragged && dragged.c.w < 0) dragged.c.w = dragged.c.el.offsetWidth;
          shown.sort((a, b) => a.y - b.y);
          let rowY = -1000,
            right = plotW - 6;
          for (const s of shown) {
            if (s.y - rowY >= 21) {
              rowY = s.y;
              right = plotW - 6;
            }
            const left = Math.max(4, right - s.c.w);
            moveTo(s.c, Math.round(left), Math.round(clampY(s.y)));
            right = left - 4;
          }
          if (dragged) moveTo(dragged.c, Math.round(Math.max(4, plotW - 6 - dragged.c.w)), Math.round(clampY(dragged.y)));
        }

        /** Drags a chip (`kind` undefined), or pulls an S / T handle out of a position chip (`kind` "sl" | "tp"): the
         *  handle's stop line appears once the finger moves and follows it, held on the valid side of the price; a tap
         *  places it at the order tickets' starting distance. */
        function startDrag(e, c, kind) {
          e.preventDefault();
          e.stopPropagation();
          const src = e.currentTarget;
          const pos = kind ? c.l : null;
          let l = c.l;
          const id = kind ? kind + ":" + refOf(pos.id) : l.id;
          const movable = kind ? true : l.drag;
          const startY = e.clientY;
          const top = host.getBoundingClientRect().top;
          const plotW = chart.timeScale().width();
          const maxY = pane0H() - 2;
          drag = { id, price: l.price, moved: false, y: startY - top, raf: 0 };
          const d0 = drag;
          if (movable) chart.applyOptions({ handleScroll: false, handleScale: false });
          if (kind) fillChip(c, pos); // the pulled handle dims
          else c.el.classList.add("dragging");
          try {
            src.setPointerCapture(e.pointerId);
          } catch (x) {}
          // one frame: the chip, its label and the ghost line follow the latest finger position
          const paint = () => {
            d0.raf = 0;
            if (drag !== d0) return;
            fillChip(c, c.l);
            if (l.kind === "pos") {
              ghost.style.display = "block";
              ghost.style.width = plotW + "px";
              ghost.style.transform = `translateY(${Math.round(d0.y)}px)`;
            }
            placeChips();
          };
          const move = (ev) => {
            if (!movable || drag !== d0) return;
            if (!d0.moved) {
              if (Math.abs(ev.clientY - startY) <= 4) return;
              d0.moved = true;
              if (kind) {
                // the new stop line appears under the finger and becomes the chip that moves
                lines = lines.filter((x) => x.id !== id).concat([stopLine(pos, kind, pos.price)]);
                renderLines();
                c = chips.get(id);
                l = c.l;
                c.el.classList.add("dragging");
              }
              post({ type: "dragstart", id });
            }
            const y = Math.max(2, Math.min(maxY, ev.clientY - top));
            const p = main.coordinateToPrice(y);
            if (p === null) return;
            let price = Math.round(p * pow()) / pow();
            if (kind && bid > 0 && ask > 0) price = clampStop(kind, pos.side, price, pos.gap);
            d0.y = y;
            if (price === d0.price && d0.raf) return;
            d0.price = price;
            // the price line moves with the chart's own frame; the chip with ours
            const pl = priceLines.get(id);
            if (pl && l.kind !== "pos") {
              pl.line.applyOptions({ price });
              pl.key = "";
            }
            if (!d0.raf) d0.raf = requestAnimationFrame(paint);
          };
          const up = () => {
            src.removeEventListener("pointermove", move);
            src.removeEventListener("pointerup", up);
            src.removeEventListener("pointercancel", up);
            src.removeEventListener("lostpointercapture", up);
            if (d0.raf) cancelAnimationFrame(d0.raf);
            c.el.classList.remove("dragging");
            ghost.style.display = "none";
            chart.applyOptions({ handleScroll: { horzTouchDrag: true, vertTouchDrag: false, pressedMouseMove: true }, handleScale: { axisPressedMouseMove: true, pinch: true, mouseWheel: true } });
            if (drag !== d0) return;
            drag = null;
            if (kind) {
              // dropped where the finger lifted, or (a tap) at the starting distance; it stays until the app answers
              const price = d0.moved ? d0.price : defaultStop(kind, pos.side, pos.pip, pos.gap);
              lines = lines.filter((x) => x.id !== id);
              if (price !== null) {
                const made = stopLine(pos, kind, price);
                lines = lines.concat([made]);
                const st = (sticky = { line: made, until: Date.now() + 700 });
                setTimeout(() => {
                  if (sticky !== st || (drag && drag.id === id)) return;
                  sticky = null;
                  if (lines.indexOf(made) >= 0) {
                    lines = lines.filter((x) => x !== made);
                    renderLines();
                  }
                }, 750);
                post({ type: "drag", id, price });
              }
            } else if (d0.moved && l.drag) {
              // a stop, order or alert stays at the drop price until the app answers with its lines (a position
              // line stays where it is: its drag sets the SL or TP)
              if (l.kind !== "pos") {
                c.l = Object.assign({}, c.l, { price: d0.price });
                lines = lines.map((x) => (x.id === l.id ? c.l : x));
              }
              post({ type: "drag", id: l.id, price: d0.price });
            } else if (!d0.moved) post({ type: "tap", id: l.id });
            if (pendingLines) {
              lines = withSticky(pendingLines);
              pendingLines = null;
            }
            renderLines();
          };
          src.addEventListener("pointermove", move);
          src.addEventListener("pointerup", up);
          src.addEventListener("pointercancel", up);
          // a lost capture (the system took the touch) ends the drag too: never a stuck chip
          src.addEventListener("lostpointercapture", up);
        }

        /* ---------------- long press on the plot ---------------- */

        let lpTimer = null,
          lpX = 0,
          lpY = 0;
        host.addEventListener(
          "touchstart",
          (e) => {
            if (e.touches.length !== 1 || drag) return;
            lpX = e.touches[0].clientX;
            lpY = e.touches[0].clientY;
            clearTimeout(lpTimer);
            lpTimer = setTimeout(() => {
              const rect = host.getBoundingClientRect();
              const y = lpY - rect.top;
              if (!main || y > pane0H()) return;
              const p = main.coordinateToPrice(y);
              if (p !== null) post({ type: "long", price: Math.round(p * pow()) / pow() });
            }, 600);
          },
          { passive: true },
        );
        const cancelLp = (e) => {
          if (e && e.touches && e.touches.length && Math.hypot(e.touches[0].clientX - lpX, e.touches[0].clientY - lpY) < 8) return;
          clearTimeout(lpTimer);
        };
        host.addEventListener("touchmove", cancelLp, { passive: true });
        host.addEventListener("touchend", () => clearTimeout(lpTimer), { passive: true });
        host.addEventListener("touchcancel", () => clearTimeout(lpTimer), { passive: true });

        function setPalette(p) {
          pal = p;
          setVars();
          if (!chart) return;
          chart.applyOptions({
            layout: { background: { type: "solid", color: pal.bg }, textColor: pal.fg3, panes: { separatorColor: sepColor() } },
            grid: { vertLines: { color: pal.grid }, horzLines: { color: pal.grid } },
            rightPriceScale: { borderColor: pal.line },
            timeScale: { borderColor: pal.line },
            crosshair: { vertLine: { color: pal.fg3, labelBackgroundColor: pal.label }, horzLine: { color: pal.fg3, labelBackgroundColor: pal.label } },
          });
          if (ctype === "candles") main.applyOptions({ upColor: pal.up, downColor: pal.down, wickUpColor: pal.up, wickDownColor: pal.down });
          else if (ctype === "bars") main.applyOptions({ upColor: pal.up, downColor: pal.down });
          else if (ctype === "line") main.applyOptions({ color: pal.gold });
          else main.applyOptions({ lineColor: pal.gold });
          vol.setData(data.map(volPoint));
          if (layer) layer.setPalette(pal);
          bidLine.applyOptions({ color: pal.fg2, axisLabelColor: pal.fg2, axisLabelTextColor: pal.dark ? "#0a0a0d" : "#fff" });
          askLine.applyOptions({ color: pal.up, axisLabelColor: pal.up });
          wm.setDark(pal.dark);
          for (const c of chips.values()) c.sig = "";
          renderLines();
          legendSig = "";
          legend();
        }

        function recv(m) {
          switch (m.type) {
            case "init":
              return build(m);
            case "bars":
              return setBars(m.bars);
            case "older":
              return prepend(m.bars, m.exhausted);
            case "bar":
              return upsertBar(m.bar);
            case "quote":
              return setQuote(m.bid, m.ask);
            case "lines":
              // while a chip is dragged the app's lines wait: the dragged line stays under the finger
              if (drag && drag.moved) {
                pendingLines = m.lines || [];
                return;
              }
              lines = withSticky(m.lines || []);
              return renderLines();
            case "palette":
              return setPalette(m.palette);
            case "indicators":
              return setIndicators(m.indicators);
            case "chartType":
              return setChartType(m.chartType);
          }
        }

        window.K = {
          recv(msg) {
            recv(typeof msg === "string" ? JSON.parse(msg) : msg);
          },
          /** Several commands in one call (the app coalesces quotes, bars and lines to one call per frame). */
          batch(msgs) {
            const list = typeof msgs === "string" ? JSON.parse(msgs) : msgs;
            for (const m of list) recv(m);
          },
        };
        window.addEventListener("resize", () => {
          schedulePlace();
          legendSig = "";
          scheduleLegend();
        });
        setInterval(() => {
          if (!drag) schedulePlace();
        }, 400);
        post({ type: "ready" });
      })();
    </script>
  </body>
</html>
